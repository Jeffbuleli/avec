# e-AVEC — same VPS, same Postgres as McBuleli
# Usage (from this directory):
#   cp .env.example .env
#   # JWT_SECRET / DATABASE credentials MUST match McBuleli
#   docker compose up -d --build
#
# Requires the McBuleli compose network: `mcbuleli_default`

name: eavec

services:
  web:
    build:
      context: ../..
      dockerfile: ops/vps/Dockerfile
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://e-avec.org}
        NEXT_PUBLIC_MCBULELI_ORIGIN: ${NEXT_PUBLIC_MCBULELI_ORIGIN:-https://mcbuleli.org}
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-mcbuleli}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-mcbuleli}
      PORT: "3001"
      HOSTNAME: "0.0.0.0"
    ports:
      - "127.0.0.1:3001:3001"
    networks:
      - mcbuleli_default

networks:
  mcbuleli_default:
    external: true
